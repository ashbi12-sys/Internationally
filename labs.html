<h1>Interactive Labs & Botanical Spa Studio</h1>

<script>
const $=id=>document.getElementById(id);

function binary(el){
  let bits=[0,0,0,0,0,0,0,0];
  el.innerHTML=`<h2>Binary Lab (ICT)</h2><p>Computers count with 0s and 1s. Tap a bit to flip it.</p><div class="bits" id="bits"></div><div class="big" id="dec"></div><div id="eq"></div><label for="n">Or type a number from 0 to 255</label><input id="n" type="number" min="0" max="255">`;
  const draw=()=>{
    $("bits").innerHTML="";
    bits.forEach((b,i)=>{
      const v=128>>i,btn=document.createElement("button");
      btn.className="bit"+(b?" on":"");btn.innerHTML=`<small>${v}</small><b>${b}</b>`;
      btn.setAttribute("aria-label","Bit worth "+v+", currently "+b);
      btn.onclick=()=>{bits[i]=1-bits[i];draw()};$("bits").append(btn);
    });
    const parts=bits.map((b,i)=>b?128>>i:0).filter(Boolean),sum=parts.reduce((a,b)=>a+b,0);
    $("dec").textContent=sum;
    $("eq").textContent=parts.length?parts.join(" + ")+" = "+sum:"All bits are off, so the value is 0.";
  };
  $("n").oninput=e=>{const v=Math.max(0,Math.min(255,parseInt(e.target.value)||0));bits=v.toString(2).padStart(8,"0").split("").map(Number);draw()};
  draw();
}

function recipe(el){
  el.innerHTML=`<h2>Recipe Scaler (Home Economics)</h2><p>Change the number of servings and every ingredient adjusts.</p>
  <div class="cols"><div><label for="o">Recipe makes</label><input id="o" type="number" min="1" value="4"></div><div><label for="d">You need</label><input id="d" type="number" min="1" value="10"></div></div>
  <label for="ing">Ingredients (one per line, start with the amount)</label><textarea id="ing">2 cups rice\n1/2 tsp salt\n1 1/2 tbsp cooking oil\n3 cloves garlic</textarea>
  <div class="out"><b>Scaled ingredients</b><ul id="res"></ul></div>`;
  const fmt=n=>String(Math.round(n*100)/100);
  const num=s=>{s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
  const run=()=>{
    const f=(+$("d").value||0)/(+$("o").value||1);
    $("res").innerHTML=$("ing").value.split("\n").filter(l=>l.trim()).map(l=>{
      const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
      return "<li>"+(m?fmt(num(m[1])*f)+" "+m[2]:l)+"</li>";
    }).join("");
  };
  ["o","d","ing"].forEach(i=>$(i).oninput=run);run();
}

function measure(el){
  const U={mm:1,cm:10,m:1000,in:25.4,ft:304.8};
  const opts=k=>Object.keys(U).map(u=>`<option ${u===k?"selected":""}>${u}</option>`).join("");
  el.innerHTML=`<h2>Measurement Converter (Industrial Arts)</h2><p>Convert between metric and inch units before you cut.</p>
  <div class="cols"><div><label for="v">Value</label><input id="v" type="number" value="2.5" step="any"></div><div><label for="f">From</label><select id="f">${opts("m")}</select></div><div><label for="t">To</label><select id="t">${opts("cm")}</select></div></div>
  <div class="out"><div class="big" id="r"></div><div id="note"></div></div>`;
  const run=()=>{
    const mm=(+$("v").value||0)*U[$("f").value],r=mm/U[$("t").value];
    $("r").textContent=(Math.round(r*1000)/1000)+" "+$("t").value;
    $("note").textContent="That equals "+(Math.round(mm/25.4*100)/100)+" inches or "+(Math.round(mm/10*100)/100)+" cm.";
  };
  ["v","f","t"].forEach(i=>$(i).oninput=run);run();
}

function planting(el){
  el.innerHTML=`<h2>Planting Calculator (Agri-Fishery Arts)</h2><p>Estimate how many seedlings your garden plot needs.</p>
  <div class="cols"><div><label for="L">Plot length (m)</label><input id="L" type="number" value="10" min="1" step="any"></div><div><label for="W">Plot width (m)</label><input id="W" type="number" value="4" min="1" step="any"></div></div>
  <div class="cols"><div><label for="rs">Space between rows (cm)</label><input id="rs" type="number" value="50" min="5"></div><div><label for="ps">Space between plants (cm)</label><input id="ps" type="number" value="30" min="5"></div></div>
  <div class="out"><div class="big" id="tot"></div><div id="det"></div></div>`;
  const run=()=>{
    const rows=Math.floor(($("W").value*100)/($("rs").value||1)),per=Math.floor(($("L").value*100)/($("ps").value||1));
    $("tot").textContent=(rows*per)+" seedlings";
    $("det").textContent=rows+" rows with "+per+" plants per row on a "+($("L").value*$("W").value)+" square meter plot.";
  };
  ["L","W","rs","ps"].forEach(i=>$(i).oninput=run);run();
}

const LAB3D=(()=>{
const PI=Math.PI,D=PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgbOf=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mixHex=(a,b,t)=>{const x=rgbOf(a),y=rgbOf(b);return"#"+[0,1,2].map(i=>Math.round(x[i]+(y[i]-x[i])*t).toString(16).padStart(2,"0")).join("")};

function box(cx,cy,cz,w,h,d,c,cb,b){const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2,B=b||0;return[
 {v:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c,b:B},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],c:cb||c,b:B},
 {v:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],c,b:B},{v:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c,b:B},
 {v:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],c,b:B},{v:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],c,b:B}]}
function prism(p0,p1,r0,r1,n,c,c2){const a=norm(sub(p1,p0)),h=Math.abs(a[1])<.9?[0,1,0]:[1,0,0],u=norm(cross(a,h)),v=cross(a,u);
 const ring=(p,r)=>Array.from({length:n},(_,i)=>{const t=i/n*2*PI;return add(p,add(mul(u,r*Math.cos(t)),mul(v,r*Math.sin(t))))});
 const A=ring(p0,r0),B=ring(p1,r1),f=[];for(let i=0;i<n;i++){const j=(i+1)%n;f.push({v:[A[i],A[j],B[j],B[i]],c})}
 f.push({v:A,c:c2||c},{v:B,c:c2||c});return f}
function ell(c,rx,ry,rz,col,n=10,m=6){const Q=(i,j)=>{const th=i/m*PI,ph=j/n*2*PI;return[c[0]+rx*Math.sin(th)*Math.cos(ph),c[1]+ry*Math.cos(th),c[2]+rz*Math.sin(th)*Math.sin(ph)]},f=[];for(let i=0;i<m;i++)for(let j=0;j<n;j++)f.push({v:[Q(i,j),Q(i,j+1),Q(i+1,j+1),Q(i+1,j)],c:col});return f}
function loft(secs,n,col,colB,p=.55){const ring=s=>Array.from({length:n},(_,i)=>{const t=i/n*2*PI,c=Math.cos(t),z=Math.sin(t);return[(s.x||0)+s.w/2*Math.sign(c)*Math.pow(Math.abs(c),p),(s.y||0)+s.h/2*Math.sign(z)*Math.pow(Math.abs(z),p),s.z]});
 const R=secs.map(ring),f=[];for(let a=0;a<R.length-1;a++)for(let i=0;i<n;i++){const j=(i+1)%n;f.push({v:[R[a][i],R[a][j],R[a+1][j],R[a+1][i]],c:Math.sin((i+.5)/n*2*PI)<0?(colB||col):col})}
 f.push({v:R[0],c:col},{v:R[R.length-1],c:col});return f}
function slab(p0,p1,w0,w1,h,c){const d=norm(sub(p1,p0)),u=norm(cross(d,[0,1,0])),up=[0,h/2,0];const q=(p,w,sg,sv)=>add(add(p,mul(u,w/2*sg)),mul(up,sv));
 const A=[q(p0,w0,-1,1),q(p0,w0,1,1),q(p1,w1,1,1),q(p1,w1,-1,1)],B=[q(p0,w0,-1,-1),q(p0,w0,1,-1),q(p1,w1,1,-1),q(p1,w1,-1,-1)];
 return[{v:A,c},{v:B,c},{v:[A[0],A[1],B[1],B[0]],c},{v:[A[1],A[2],B[2],B[1]],c},{v:[A[2],A[3],B[3],B[2]],c},{v:[A[3],A[0],B[0],B[3]],c}]}
function extrude(pts,y0,y1,c){const T=pts.map(p=>[p[0],y1,p[1]]),B=pts.map(p=>[p[0],y0,p[1]]),f=[{v:T,c},{v:B,c}];for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;f.push({v:[B[i],B[j],T[j],T[i]],c})}return f}
const quad=(y,x0,z0,x1,z1,c,b)=>({v:[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],c,b:b||0});
const mapF=(faces,fn)=>faces.map(f=>({...f,v:f.v.map(fn)}));
const disc=(x,z,r)=>Array.from({length:28},(_,j)=>[x+r*Math.cos(j/28*2*PI),z+r*Math.sin(j/28*2*PI)]);
const ellp=(cx,y,cz,rx,rz)=>Array.from({length:33},(_,i)=>[cx+rx*Math.cos(i/32*2*PI),y,cz+rz*Math.sin(i/32*2*PI)]);

function studio(el,cfg){
const TASKS=cfg.tasks,TOOLS=cfg.tools,LES=cfg.lessons,SLOTS=cfg.slots,PLACED=cfg.placed,N=TASKS.length,tdef=id=>TOOLS.find(t=>t.id===id);
let P;try{P=JSON.parse(localStorage.getItem(cfg.key))||{}}catch(e){P={}}P.d=P.d||{};P.fl=P.fl||0;
const savep=()=>{try{localStorage.setItem(cfg.key,JSON.stringify(P))}catch(e){}};
const S={mode:"learn",step:0,level:1,skin:cfg.skin?1:0,sel:null,info:null};
let body=cfg.build(S.skin),tools=[],run=null,drag=null,down=null,camDrag=null,hov=null,raf=0,path=null,camS=null,hang=0,hT=0;
const CP=cfg.camP;let cam={yaw:0,pitch:CP.pitch,dist:CP.dist},camT={...cam},tg=CP.tg.slice(),tgT=CP.tg.slice();
const ACC="#0f766e",RING="#d97706";

el.innerHTML=`<h2>${cfg.title}</h2><p>${cfg.intro}</p>
<div class="hm-top"><button class="hm-tab" data-m="learn">1. Botanical Massage Guide</button><button class="hm-tab" data-m="practice">2. Interactive 3D Spa Studio</button></div>
<div class="hm"><div><canvas id="hmc" role="img" aria-label="${cfg.title} 3D interactive scene"></canvas>
<div class="hm-ctl">${cfg.flip?'<button class="btn alt" id="hflip">Flip Palm</button>':''}<button class="btn alt" id="hzin">Zoom +</button><button class="btn alt" id="hzout">Zoom −</button><button class="btn alt" id="hreset">Reset View</button>${cfg.skin?'<label class="hm-skin">Skin tone <select id="skin"><option value="0">Fair</option><option value="1" selected>Warm Golden</option><option value="2">Rich Bronze</option></select></label>':''}</div>
<p class="hm-hint">💡 Drag background to orbit camera. Click tools or drag them onto palm reflexology zones. Enjoy buttery smooth 60FPS botanical lighting!</p></div>
<div class="hm-side" id="hside"></div></div>`;
const cv=el.querySelector("#hmc"),ctx=cv.getContext("2d"),side=el.querySelector("#hside");

const makeTools=shuf=>{const order=SLOTS.map((_,i)=>i);if(shuf)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
