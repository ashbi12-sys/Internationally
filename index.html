<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace | Buy, sell and give things away worldwide</title>
<meta name="description" content="Buy, sell and give things away anywhere in the world. Free to use, with photos, chat, and safety tools.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mute:#5b6479;--line:#e2e6f0;--pri:#1a56db;--pri2:#0e9f8e;--onpri:#fff;--acc:#f5a400;--red:#d62839;--ok:#15803d;--soft:#e8efff;--shadow:0 1px 2px rgba(20,33,61,.05),0 8px 24px rgba(20,33,61,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#161e33;--ink:#eaf0ff;--mute:#9aa6c4;--line:#263152;--pri:#6ea0ff;--pri2:#35d1bd;--onpri:#08122b;--acc:#ffc233;--red:#ff6b7a;--ok:#4ade80;--soft:#1d2a4d;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
a{color:var(--pri)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.2rem;margin-right:auto;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:.66rem;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;line-height:1}
.brand svg{width:36px;height:36px}
#nav{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.nl{font:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:transparent;border:0;text-decoration:none;padding:8px 11px;border-radius:10px;cursor:pointer;position:relative;white-space:nowrap}
.nl:hover{background:var(--soft)}
.nl.learn{color:var(--pri2)}
.badge{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--pri);background:var(--pri);color:var(--onpri);border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--pri)}
.btn.bad{background:transparent;color:var(--red);border-color:var(--red)}
main{padding-bottom:90px;min-height:70vh}
.hero{margin:18px 0 22px;padding:34px 26px;border-radius:28px;color:#fff;background:radial-gradient(500px 260px at 90% 0%,rgba(245,164,0,.35),transparent),linear-gradient(135deg,#1a56db,#0e9f8e);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.9}
.hero h1{font-size:clamp(2.2rem,6.5vw,3.4rem);font-weight:700;letter-spacing:-.04em;line-height:1.08;margin:6px 0 6px}
.hero p{margin:0 0 20px;font-size:1.08rem;opacity:.95;max-width:46ch}
.hs{display:flex;gap:10px;flex-wrap:wrap}
.hs .search{flex:1 1 260px;background:#fff;border-color:transparent}
.hs select{background:#fff;color:#14213d;border-color:transparent;min-width:200px}
.trust{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:16px;font-size:.84rem;font-weight:600;opacity:.95}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.search input{flex:1;border:0;background:transparent;color:#14213d;font:inherit;padding:13px 0;outline:none;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.cat{font:inherit;font-weight:600;font-size:.88rem;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer}
.cat[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--pri)}
.card .im{aspect-ratio:1;background:linear-gradient(140deg,var(--soft),color-mix(in srgb,var(--pri) 20%,var(--card)));display:grid;place-items:center;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:3.4rem}
.card .tx{padding:10px 12px 12px}
.pr{font-weight:800;font-size:1.1rem}
.card h3{margin:2px 0 4px;font-size:.92rem;font-weight:400;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mt{color:var(--mute);font-size:.78rem}
.center{text-align:center;padding:16px 0}
.none{text-align:center;color:var(--mute);padding:50px 10px}
.foot{padding-bottom:34px;color:var(--mute);font-size:.84rem;text-align:center;line-height:2}
.foot a{margin:0 6px}
</style>
</head>
<body>
<header class="top"><div class="wrap nav">
<a class="brand" href="#/"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="#f5a400"/><g stroke="#f5a400" stroke-width="3" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.500 3.500M28.500 28.500 32 32M8 32l3.500-3.500M28.500 11.500 32 8"/></g><circle cx="20" cy="20" r="3" fill="#1a56db"/></svg><span>Marketplace<small>Worldwide</small></span></a>
<nav id="nav" aria-label="Main"></nav>
</div></header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="wrap foot"><a href="learn.html">Learn</a>·<a href="#/safety">Safety</a>·<a href="#/terms">Terms</a>·<a href="#/privacy">Privacy</a></footer>
<script>
document.getElementById("view").innerHTML = '<div style="padding:40px;text-align:center;"><h1>Welcome to Marketplace</h1><p>Explore listings or visit the <a href="learn.html">Learning Hub</a>.</p></div>';
document.getElementById("nav").innerHTML = '<a class="nl learn" href="learn.html">🎓 Learn</a>';
</script>
</body>
</html>
