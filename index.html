   if(auth&&sess&&sess.expires_at-Date.now()/1000<45){try{await refreshSession()}catch(e){if(!sess)throw new HttpError("Please log in again.",401)}}
   const h={apikey:KEY,...(o.headers||{})};
   const tok=auth&&sess?sess.access_token:(KEY.startsWith("eyJ")?KEY:null);if(tok)h.Authorization="Bearer "+tok;
   let body=o.body;if(body!==undefined&&!(body instanceof Blob)){h["Content-Type"]="application/json";body=JSON.stringify(body)}
   let r;try{r=await fetch(BASE+path,{method,headers:h,body})}catch(e){throw new Error("No internet connection. Please try again.")}
   if(r.status===401&&auth&&sess&&!o._r){try{await refreshSession()}catch(e){}if(sess)return http(path,{...o,_r:1});throw new HttpError("Please log in again.",401)}
   if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw new HttpError(friendly(e.message||e.msg||e.error_description||e.error||("Error "+r.status)),r.status,e.code||e.error_code)}
   if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null;

 const drawPh=()=>{if(l)return;$("#ph").innerHTML=files.map((f,i)=>`<div class="pv"><img src="${esc(f.url)}" alt="Photo ${i+1}"><button type="button" data-rm="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join("")+(files.length<5?'<button type="button" class="add" id="addp">+ Add photo</button>':"");if($("#addp"))$("#addp").onclick=()=>$("#pf").click()};
 if(!l){drawPh();$("#pf").onchange=e=>{const err=$("#s-err");for(const f of e.target.files){if(files.length>=5){err.textContent="You can add up to 5 photos.";break}if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)){err.textContent="Please choose a photo.";continue}if(f.size>20*1024*1024){err.textContent="That photo is too big (max 20 MB).";continue}files.push({file:f,url:URL.createObjectURL(f)})}e.target.value="";drawPh()};

  err("");const btn=e.submitter;btn.disabled=true;const label=btn.textContent;

async function chatView(id){
 if(backendNeeded())return;if(!sess)return needAuthView("Log in to chat");
 if(!UUIDRE.test(id)){view.innerHTML='<div class="panel"><h2>Chat not found</h2></div>';return}
 view.innerHTML='<p class="none"><span class="sp"></span> Loading…</p>';
 const rows=await http("/rest/v1/conversations?"+qs([["id","eq."+id],["select",CSEL]]));const c=rows[0];
 if(!c){view.innerHTML='<div class="panel"><h2>Chat not found</h2><a class="btn" href="#/messages">Back to messages</a></div>';return}
 const meId=sess.user.id,mineBuyer=c.buyer_id===meId,oid=mineBuyer?c.seller_id:c.buyer_id,o=(mineBuyer?c.seller:c.buyer)||{},l=c.listing;
 let msgs=[],lastAt=null,blocked=false,busy=false;
 view.innerHTML=`<div class="chat"><div class="chead"><a href="#/messages" aria-label="Back to messages">←</a>${l?`<a class="th" href="#/listing/${esc(l.id)}">${l.thumbs&&l.thumbs[0]?`<img src="${esc(pub(l.thumbs[0]))}" alt="">`:emoOf(l.category)}</a>`:""}<div style="flex:1;min-width:140px"><b>${esc(o.display_name||"User")}</b><div class="mt">${l?`<a href="#/listing/${esc(l.id)}">${esc(l.title)}</a> · ${esc(money(l.price,l.currency))}`:"Item removed"}</div></div><button class="btn alt sm" data-act="chatmenu" aria-label="Chat options">⋯</button></div><div class="msgs" id="ms" aria-live="polite"></div><div id="qk"></div><div id="cp"></div></div>`;
 const hm=t=>new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
 const draw=()=>{const el=$("#ms");if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<120;let day="",h="";
  for(const m of msgs){const d=new Date(m.created_at).toDateString();if(d!==day){day=d;h+=`<div class="day">${new Date(m.created_at).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</div>`}
   const me_=m.sender_id===meId;h+=`<div class="b ${me_?"me":""} ${m.pending?"pend":""} ${m.failed?"fail":""}">${esc(m.body)}<span class="tm">${m.failed?`Not sent. <button class="lnk" data-retry="${esc(m.id)}">Tap to retry</button>`:m.pending?"Sending…":hm(m.created_at)}</span></div>`}
  if(!msgs.length)h='<p class="none">Say hello! Ask if the item is still available.</p>';el.innerHTML=h;if(near||msgs[msgs.length-1]&&msgs[msgs.length-1].sender_id===meId)el.scrollTop=el.scrollHeight;
  const q=$("#qk");if(q)q.innerHTML=!blocked&&!msgs.some(m=>m.sender_id===meId)?`<div class="quick">${["Is this still available?","What is your lowest price?","Can you ship to my country?"].map(t=>`<button data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""};
 const drawCp=()=>{$("#cp").innerHTML=blocked?`<p class="note">You blocked this user. <button class="lnk" data-act="unblock">Unblock</button></p>`:`<form class="compose" id="cf"><textarea id="ct" rows="1" maxlength="1000" placeholder="Write a message" aria-label="Message"></textarea><button class="btn" type="submit">Send</button></form>`;
  if($("#cf")){const t=$("#ct");t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#cf").requestSubmit()}};$("#cf").onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(!v)return;t.value="";send(v)}}};
 const markRead=async()=>{const last=msgs.filter(m=>!m.pending&&!m.failed).slice(-1)[0];if(!last)return;const cur=mineBuyer?c.buyer_last_read:c.seller_last_read;if(cur&&new Date(cur)>=new Date(last.created_at))return;
  try{await http("/rest/v1/conversations?id=eq."+id,{method:"PATCH",body:mineBuyer?{buyer_last_read:last.created_at}:{seller_last_read:last.created_at},headers:{Prefer:"return=minimal"},retry:false});if(mineBuyer)c.buyer_last_read=last.created_at;else c.seller_last_read=last.created_at;pollUnread()}catch(e){}};
 const merge=a=>{let added=0;for(const m of a)if(!msgs.some(x=>x.id===m.id)){msgs.push(m);added++}msgs.sort((x,y)=>x.created_at<y.created_at?-1:x.created_at>y.created_at?1:0);const r=msgs.filter(m=>!m.pending&&!m.failed).slice(-1)[0];if(r)lastAt=r.created_at;return added};
 const load=async first=>{if(busy)return;busy=true;try{const a=first?(await http("/rest/v1/messages?"+qs([["conversation_id","eq."+id],["order","created_at.desc"],["limit","100"]]))).reverse():await http("/rest/v1/messages?"+qs([["conversation_id","eq."+id],["created_at","gt."+lastAt],["order","created_at.asc"],["limit","100"]]));

 const send=async(text,old)=>{let t=old;if(!t){t={id:"t"+Date.now()+Math.random(),body:text,sender_id:meId,created_at:new Date().toISOString(),pending:true};msgs.push(t)}else{t.pending=true;t.failed=false}draw();

  catch(e){t.pending=false;t.failed=true;draw();toast(e.message)}};
 view._chat={send,retry:mid=>{const m=msgs.find(x=>x.id===mid);if(m)send(null,m)},reload:()=>load(true),block:async()=>{try{await http("/rest/v1/blocks",{method:"POST",body:{blocked_id:oid},headers:{Prefer:"return=minimal"},retry:false});blocked=true;drawCp();draw();toast("User blocked.")}catch(e){toast(e.message)}},unblock:async()=>{try{await http("/rest/v1/blocks?blocked_id=eq."+oid,{method:"DELETE",headers:{Prefer:"return=minimal"},retry:false});blocked=false;drawCp();draw();toast("Unblocked.")}catch(e){toast(e.message)}},oid,lid:l&&l.id};
 try{const b=await http("/rest/v1/blocks?"+qs([["blocked_id","eq."+oid],["select","blocked_id"]]));blocked=b.length>0}catch(e){}
 drawCp();await load(true);

<div class="panel"><h2>Using Marketplace</h2><ul class="rules"><li>Marketplace is run by ${esc(OPERATOR)}. It is a place where people can list items and talk to each other. We are not the buyer or seller, and we do not handle payments, delivery, or returns.</li><li>You must be <b>18 or older</b> to make an account.</li><li>You are responsible for your listings, your messages, and your deals. Only list things you own and are allowed to sell. Describe them honestly and use your own photos.</li><li>Follow the laws of your country and of the country you ship to, including import, export, tax, and sanctions rules.</li><li>Be respectful. No harassment, hate, threats, or spam.</li></ul></div>
<div class="panel"><h2>Not allowed</h2><ul class="rules"><li>Illegal items, drugs, and prescription medicine.</li><li>Weapons, ammunition, and explosives.</li><li>Stolen, fake, or counterfeit goods.</li><li>Adult content and anything that harms children.</li><li>Protected wildlife, and anything that harms animals.</li><li>Recalled or dangerous products, and hazardous materials.</li><li>Human remains or body parts, personal data, and scams or fake listings.</li></ul></div>
<div class="panel"><h2>Moderation</h2><ul class="rules"><li>We may remove listings or messages, and suspend or ban accounts, that break these terms or put people at risk.</li><li>You can report any item or person. You can block anyone you chat with.</li><li>The service is provided "as is". To the extent the law allows, ${esc(OPERATOR)} is not responsible for losses between users.</li><li>We may update these terms. Using the site after a change means you accept it.</li></ul>${C.contact?`<p class="note">Questions or takedown requests: <a href="mailto:${esc(C.contact)}">${esc(C.contact)}</a></p>`:""}</div>`}
function privacyView(){
 view.innerHTML=`<h1 style="font-size:1.6rem;margin:18px 0 12px">Privacy policy</h1>
<div class="panel"><h2>What we collect</h2><ul class="rules"><li><b>Account:</b> email, password (stored securely by our login provider), display name, and optional country and city.</li><li><b>Content:</b> items you post, the photos you upload, your messages, and reports and blocks you make.</li><li><b>Technical:</b> your login session is kept in your browser's local storage so you stay logged in. We do not use advertising or tracking cookies.</li></ul></div>
<div class="panel"><h2>How we use it</h2><ul class="rules"><li>To run Marketplace: show listings, let buyers and sellers chat, keep the site safe, and answer reports.</li><li>Your display name, country, city, items, and photos are public. Your email is never shown to other users. Messages can be read only by you and the other person, and by administrators when needed to handle a report or keep people safe.</li><li>We do not sell your data.</li></ul></div>
<div class="panel"><h2>Where it is stored</h2><ul class="rules"><li>Data is stored with our hosting, database, and login provider (Supabase). Servers may be in a country different from yours, so your data can be transferred internationally.</li></ul></div>
<div class="panel"><h2>Your choices</h2><ul class="rules"><li>You can edit your profile and remove your items at any time.</li><li>You can delete your account in <b>My account</b>. This removes your profile, items, photos, and messages.</li><li>You can ask about your data, or ask for a correction, using the contact below. The data is kept until you delete it.</li><li>Marketplace is for people aged 18 and over.</li></ul>${C.contact?`<p class="note">Controller: ${esc(OPERATOR)}. Contact: <a href="mailto:${esc(C.contact)}">${esc(C.contact)}</a></p>`:""}</div>`}
function setupView(){
 view.innerHTML=`<div class="panel"><h2>${READY?"Marketplace is connected":"Almost ready: connect the database"}</h2>${READY?"<p>Everything is set up.</p>":`<p>This site needs its database to show items, store photos, and run chat. If you are the owner, follow <b>README.txt</b>:</p><ol class="rules"><li>Create a free project at supabase.com.</li><li>Run <b>setup.sql</b> in the SQL Editor.</li><li>Copy the Project URL and the public key into <b>config.js</b>.</li><li>Commit the change on GitHub and reload this page.</li></ol>`}</div>`}

/* ================= actions ================= */
async function setStatus(id,status){
 if(!UUIDRE.test(id))return;
 if(status==="removed"&&!confirm("Remove this item?"))return;
 try{await http("/rest/v1/listings?id=eq."+id,{method:"PATCH",body:{status},headers:{Prefer:"return=minimal"},retry:false});
  if(status==="removed"){const l=await fetchListing(id).catch(()=>null);const ps=l?[...(l.photos||[]),...(l.thumbs||[])]:[];if(ps.length)http("/storage/v1/object/listing-photos",{method:"DELETE",body:{prefixes:ps},retry:false}).catch(()=>{})}
  toast(status==="removed"?"Removed.":"Updated.");if(status==="removed")location.hash="#/me";route()}catch(e){toast(e.message)}}
function reportDlg(lid,uid){
 openDlg(`<form class="dp" id="rf" novalidate><h2>Report</h2><label for="r-why">What is wrong?</label><select id="r-why">${["Scam or fraud","Prohibited item","Wrong category or fake listing","Spam","Harassment or unsafe behavior","Other"].map(r=>`<option>${r}</option>`).join("")}</select><label for="r-det">Details (optional)</label><textarea id="r-det" maxlength="500"></textarea><p class="err" id="r-err" role="alert"></p><div class="acts"><button class="btn" type="submit">Send report</button><button type="button" class="btn alt" data-close>Cancel</button></div></form>`);
 $("#rf").onsubmit=async e=>{e.preventDefault();try{await http("/rest/v1/reports",{method:"POST",body:{listing_id:lid||null,reported_user_id:uid||null,reason:$("#r-why").value,details:$("#r-det").value.trim()||null},headers:{Prefer:"return=minimal"},retry:false});$("#dlg").close();toast("Thanks. We will look into it.")}catch(x){$("#r-err").textContent=x.message}}}
function delDlg(){
 openDlg(`<form class="dp" id="df" novalidate><h2>Delete your account?</h2><p>This cannot be undone. Type <b>DELETE</b> to confirm.</p><input id="d-in" autocomplete="off"><p class="err" id="d-err" role="alert"></p><div class="acts"><button class="btn bad" type="submit">Delete forever</button><button type="button" class="btn alt" data-close>Cancel</button></div></form>`);
 $("#df").onsubmit=async e=>{e.preventDefault();if($("#d-in").value.trim()!=="DELETE")return $("#d-err").textContent="Type DELETE in capital letters.";
  try{try{const mine=await http("/rest/v1/listings?"+qs([["seller_id","eq."+sess.user.id],["select","photos,thumbs"]]));const ps=mine.flatMap(x=>[...(x.photos||[]),...(x.thumbs||[])]);if(ps.length)await http("/storage/v1/object/listing-photos",{method:"DELETE",body:{prefixes:ps},retry:false})}catch(_){}
   await http("/rest/v1/rpc/delete_my_account",{method:"POST",body:{},retry:false});$("#dlg").close();setSession(null);toast("Your account was deleted.");location.hash="#/";route()}catch(x){$("#d-err").textContent=x.message}}}
function chatMenu(){const k=view._chat;if(!k)return;openDlg(`<div class="dp"><h2>Options</h2><div class="acts" style="flex-direction:column"><button class="btn alt" data-act="reportuser">Report this person</button><button class="btn bad" data-act="blockuser">Block this person</button><button class="btn alt" data-close>Close</button></div></div>`)}
async function admDo(fn,msg){try{await fn();toast(msg);adminView()}catch(e){toast(e.message)}}

document.addEventListener("click",async e=>{
 const rt=e.target.closest("[data-retry]");if(rt&&view._chat){view._chat.retry(rt.dataset.retry);return}
 const qk=e.target.closest("[data-q]");if(qk&&view._chat){view._chat.send(qk.dataset.q);return}
 const a=e.target.closest("[data-act]");if(!a)return;const k=a.dataset.act,id=a.dataset.id;
 if(k==="login"){dlg.open&&dlg.close();authDlg("login")}else if(k==="signup"){dlg.open&&dlg.close();authDlg("signup")}else if(k==="forgot"){dlg.close();forgotDlg()}
 else if(k==="logout")logout();else if(k==="msg")startChat(id);
 else if(k==="save"){const s=saved();const n=s.includes(id)?s.filter(x=>x!==id):[...s,id];setSaved(n);a.textContent=n.includes(id)?"♥ Saved":"♡ Save"}
 else if(k==="share"){const u=location.href;if(navigator.share){navigator.share({title:document.title,url:u}).catch(()=>{})}else{try{await navigator.clipboard.writeText(u);toast("Link copied.")}catch(x){toast(u)}}}
 else if(k==="report"){if(backendNeeded())return;const uid=a.dataset.uid;if(needLogin(()=>reportDlg(id,uid)))return;reportDlg(id,uid)}
 else if(k==="sold")setStatus(id,"sold");else if(k==="avail")setStatus(id,"available");else if(k==="remove")setStatus(id,"removed");
 else if(k==="delacct")delDlg();else if(k==="chatmenu")chatMenu();
 else if(k==="reportuser"){dlg.close();reportDlg(view._chat.lid,view._chat.oid)}else if(k==="blockuser"){dlg.close();if(confirm("Block this person? Neither of you can send messages in this chat."))view._chat.block()}
 else if(k==="unblock")view._chat.unblock();else if(k==="reload")view._chat.reload();
 else if(k==="adm-remove"){if(confirm("Remove this item?"))admDo(async()=>{await http("/rest/v1/listings?id=eq."+id,{method:"PATCH",body:{status:"removed"},headers:{Prefer:"return=minimal"},retry:false});await http("/rest/v1/reports?id=eq."+a.dataset.rid,{method:"PATCH",body:{status:"resolved"},headers:{Prefer:"return=minimal"},retry:false})},"Item removed.")}
 else if(k==="adm-ban"||k==="adm-unban"){const ban=k==="adm-ban";if(!ban||confirm("Ban this user? They will not be able to post or message."))admDo(()=>http("/rest/v1/rpc/admin_set_ban",{method:"POST",body:{target:a.dataset.uid,banned:ban},retry:false}),ban?"User banned.":"User unbanned.")}
 else if(k==="adm-done")admDo(()=>http("/rest/v1/reports?id=eq."+a.dataset.rid,{method:"PATCH",body:{status:"resolved"},headers:{Prefer:"return=minimal"},retry:false}),"Marked resolved.")});

/* ================= router ================= */
async function route(){
 stopTimers();view._chat=null;const parts=location.hash.replace(/^#\/?/,"").split("/"),name=parts[0]||"home",arg=parts[1]||"";
 window.scrollTo(0,0);
 try{
  if(!READY&&!["safety","terms","privacy","setup"].includes(name)){setupView();return}
  if(name==="home")home();else if(name==="listing")await listingView(arg);else if(name==="sell")await sellView();else if(name==="edit")await sellView(arg);
  else if(name==="messages")await messagesView();else if(name==="chat")await chatView(arg);else if(name==="me")await meView();else if(name==="admin")await adminView();
  else if(name==="saved")await savedView();else if(name==="safety")safetyView();else if(name==="terms")termsView();else if(name==="privacy")privacyView();else if(name==="setup")setupView();else home()}
 catch(e){view.innerHTML=`<div class="panel"><h2>Something went wrong</h2><p>${esc(e.message||"Please try again.")}</p><button class="btn" id="rt2">Try again</button></div>`;$("#rt2").onclick=route}}
window.addEventListener("hashchange",()=>{if(/access_token=/.test(location.hash))takeAuthHash().then(route);else route()});
window.addEventListener("online",()=>{$("#off").style.display="none";pollUnread()});window.addEventListener("offline",()=>{$("#off").style.display="block"});
if(!navigator.onLine)$("#off").style.display="block";
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollUnread()});
(async function boot(){
 renderHeader();
 if(READY){await takeAuthHash();if(sess){await loadMe()}setInterval(pollUnread,30000);pollUnread()}
 route()})();
})();
</script>
</body>
</html>
